<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Thread - SPIN VAR PLANT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="website">

    <div class="header">
        <div class="header-left">
            <div class="logo-box">SPIN VAR PLANT</div>
            <div class="h-text">H</div>

            <div class="nav">
                <a href="index.html">HOME</a>
                <a href="market.html">MARKETPLACE</a>
                <a href="forum.html">FORUM</a>
                <a href="news.html">NEWS</a>
            </div>
        </div>

        <div class="header-right">
            <div class="p-text">P</div>
            <button class="number-box">1</button>
        </div>
    </div>

    <div class="content">

        <h1>CREATE THREAD</h1>

        <p>Create a new discussion thread.</p>

        <input type="text" id="username" placeholder="Your Name">

        <input type="text" id="title" placeholder="Thread Title">

        <select id="category">
            <option value="">Select Category</option>
            <option value="General">General</option>
            <option value="Marketplace Help">Marketplace Help</option>
            <option value="Plant Updates">Plant Updates</option>
            <option value="Questions">Questions</option>
        </select>

        <textarea id="message" rows="8" placeholder="Write your thread here..."></textarea>

        <button onclick="createThread()">
            CREATE THREAD
        </button>

        <br><br>

        <a href="forum.html" class="card-btn">
            BACK TO FORUM
        </a>

    </div>

</div>

<script type="module" src="firebase.js"></script>
<script src="script.js"></script>

</body>
</html>
